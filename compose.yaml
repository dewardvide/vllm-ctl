# vLLM Admin UI — deployable as a Docker Compose resource (e.g. Coolify).
#
# Environment (all optional):
#   PORT            3333   port the UI listens on inside the container (and is published on)
#   VLLM_BASE_URL   http://host.docker.internal:8000
#                   Where the host's model server lives, as seen from the container.
#                   Inside the container 127.0.0.1 is the container itself, so use
#                   host.docker.internal (mapped to the host via extra_hosts below).
#                   NOTE: the app currently derives engine URLs from each deployment's
#                   bind host/port and does not read this variable itself; it is
#                   passed through so the intended address is configured in one place.
#   HF_TOKEN        (empty)  Hugging Face token for gated model downloads
# App state (SQLite db, settings, logs, benchmark output) lives in the
# `vllm-admin-data` volume, mounted at /data.
services:
  vllm-admin-ui:
    build: .
    image: vllm-admin-ui:latest
    restart: unless-stopped
    ports:
      - "${PORT:-3333}:3333"
    environment:
      PORT: "3333"
      VLLM_ADMIN_DATA_DIR: /data
      VLLM_BASE_URL: ${VLLM_BASE_URL:-http://host.docker.internal:8000}
      HF_TOKEN: ${HF_TOKEN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - vllm-admin-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3333/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  vllm-admin-data:
