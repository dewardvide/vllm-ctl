# vLLM Admin UI — host-integrated deployment (Coolify docker-compose resource).
#
# This app is a *supervisor*: it spawns the host's `vllm` / `llama` binaries,
# scans /proc for their pids, reads host CPU from /proc/stat, runs host
# `guidellm` for benchmarks, downloads with the host `hf` CLI, and polls
# `nvidia-smi`. So the container shares the host's network and PID namespace and
# bind-mounts the host userland it needs. Anything less and half the UI is dead.
#
# Requires: NVIDIA driver + the NVIDIA Container Toolkit with a generated CDI
# spec (`nvidia-ctk cdi generate --output=/etc/cdi/nvidia.yaml`). The GPU comes
# in through the CDI device below, which injects the device nodes, the driver
# libraries and nvidia-smi — so no host userland mount is needed for the GPU.
#
# Environment:
#   PORT            3333   listen port (host network, so this is the real port)
#   HF_TOKEN        (empty) Hugging Face token for gated downloads
# App state (SQLite db, settings, logs, benchmark output) lives in the
# `vllm-admin-data` volume at /data.
services:
  vllm-admin-ui:
    build: .
    image: vllm-admin-ui:host-integrated
    restart: unless-stopped
    network_mode: host
    pid: host
    environment:
      PORT: "3333"
      VLLM_ADMIN_DATA_DIR: /data
      HOME: /home/dewardvide
      PATH: /home/dewardvide/.local/bin:/home/dewardvide/granite-inference/.venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      HF_TOKEN: ${HF_TOKEN:-}
    # GPU via the CDI spec: device nodes + driver libs + nvidia-smi, per-driver.
    devices:
      - nvidia.com/gpu=all
    volumes:
      # App state
      - vllm-admin-data:/data
      # Host userland the supervisor launches: venv, uv-managed python, llama.cpp,
      # guidellm, HF cache, hf token. Read-write because downloads write the cache.
      - /home/dewardvide:/home/dewardvide
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3333/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  vllm-admin-data:
